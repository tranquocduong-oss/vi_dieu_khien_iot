name: vi_dieu_khien_iot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  http: ^1.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_database: ^12.6.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # 👈 Thêm thư viện đổi logo

# 👇 Cấu hình đổi logo App
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/Success.json
    - assets/icon/ # 👈 Thêm dòng này để Flutter nhận diện thư mục chứa logo